<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" href="/src/assets/deal-profit-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Deal Profit — price errors, penny deals, hidden discounts and profitable finds shared in real time. Catch the deals before everyone else." />
    <meta name="theme-color" content="#07070a" />
    <!-- Fonts.

         Space Grotesk + Inter was the previous pairing and it was the generic
         choice: Space Grotesk on a dark slate background has become its own
         cliché, and a site about numbers does not need a friendly geometric.

         Archivo carries a width axis (62–125), so the display weight can be set
         tight and expanded per role rather than being one fixed compromise.
         JetBrains Mono is not decoration — prices, percentages and timestamps
         are the entire argument of this site, and setting them in a mono makes
         digits align in columns and read as instrumented rather than marketed.
         Inter stays for body copy, where its neutrality is the point. -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..900&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700;800&display=swap"
      rel="stylesheet" />
    <!-- Whop Pixel: page views, so ad conversions can be attributed to
         this domain. Snippet pasted verbatim from Whop docs. -->
    <script>!function(w,d,s,u,n,a,b){if(w[n])return;a=w[n]={q:[],t:+new Date,s:[],o:u,track:function(){a.q.push([+new Date].concat([].slice.call(arguments)))},setScope:function(){a.s=[].slice.call(arguments).filter(function(x){return typeof x==="string"});a.q.push([+new Date,"setScope"].concat(a.s))},scope:function(){var c=[].slice.call(arguments);return{track:function(){a.q.push([+new Date].concat([].slice.call(arguments)).concat([{__scope:c}]))}}}};b=d.createElement(s);b.async=1;b.src=u+"/s.js";d.getElementsByTagName(s)[0].parentNode.insertBefore(b,d.getElementsByTagName(s)[0])}(window,document,"script","https://t.whop.tw","whop");whop.setScope("biz_olEvrfdonYlloB");whop.track("page");</script>
    <title>Deal Profit — Catch the deals before everyone else</title>

    <!-- Open Graph / Twitter card.

         Without these, a link to goosiev.com pasted into Discord or TikTok
         renders as a blank card with the URL and nothing else. These tags only
         affect link previews — search engines ignore most of them — so they
         are not cosmetic, they are the difference between a link somebody
         taps and a link somebody scrolls past.

         og:image is an absolute URL. Relative paths are not resolved by most
         scrapers, which is why a relative one silently produces no preview
         rather than a broken one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Deal Profit" />
    <meta property="og:url" content="https://goosiev.com/" />
    <meta property="og:title" content="Deal Profit — catch the deals before everyone else" />
    <meta property="og:description" content="Price errors, penny deals and hidden discounts flagged the second they go live. 7-day trial, cancel any time." />
    <meta property="og:image" content="https://goosiev.com/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Deal Profit — catch the deals before everyone else" />
    <meta name="twitter:description" content="Price errors, penny deals and hidden discounts flagged the second they go live." />
    <meta name="twitter:image" content="https://goosiev.com/og-image.png" />

    <!-- Page-specific preview. The SPA sets document.title per route, but a
         crawler that does not execute JS sees only the static tags above. -->
    <link rel="canonical" href="https://goosiev.com/" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
