name = "deal-profit-website"
# compatibility_date is independent of the wrangler version; 2026-03-15 only uses long-stable APIs.
# Workers Builds uses the wrangler pinned in package.json (currently 4.135.0).
compatibility_date = "2026-03-15"
main = "./worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = [ "/api/*" ]

# Persistent store for admin-managed config (Discord token + category IDs) and manual deals.
# A Durable Object needs nothing in the dashboard to provision — it deploys with the Worker,
# so panel settings survive across isolates/worker restarts. "main" is a single global store.
# Uses the declarative `exports` form (not the legacy `migrations` array) so the deploy
# reconciles against whatever namespace state already exists instead of re-creating it.
[[durable_objects.bindings]]
name = "DEAL_STORE"
class_name = "DealStore"

[exports.DealStore]
type = "durable-object"
storage = "sqlite"

[triggers]
# Every 5 min: #logs review-reaction moderation. The daily role-revocation
# sweep is date-gated inside scheduled() so it still runs ~once a day.
crons = ["*/5 * * * *"]

[vars]
# Everything here is PUBLIC: a [vars] entry is committed to this file, printed in
# full by `wrangler deploy`, and readable by anyone with repository access. Only
# non-secret configuration belongs in this section.
#
# Secrets (DISCORD_BOT_TOKEN, DISCORD_CLIENT_SECRET, DISCORD_PUBLIC_KEY,
# STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, DISCORD_SETUP_WEBHOOK_URL) live in the
# Cloudflare dashboard, and ADMIN_PASSWORD is set the same way:
#
#   printf '%s' "$NEW_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
#
# A Secret bound with the same name as a [vars] entry takes precedence, but do not
# rely on that: a secret CANNOT be created while a plain var of the same name is
# deployed (Cloudflare rejects it with "Binding name already in use"), so a
# password left in this file also blocks the secret that is supposed to replace it.
#
# Local development reads the same names from .dev.vars, which is gitignored.
DISCORD_CATEGORY_IDS = ""
ADMIN_USERNAME = "goosievv"
STRIPE_PUBLISHABLE_KEY = ""
DISCORD_CLIENT_ID = "1553844051449483445"
DISCORD_REDIRECT_URI = "https://goosiev.com/api/discord/callback"