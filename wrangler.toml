name = "deal-profit-website"
# compatibility_date is independent of the wrangler version; 2026-03-15 only uses long-stable APIs.
# Workers Builds uses the wrangler pinned in package.json (currently 4.135.0).
compatibility_date = "2026-03-15"
main = "./worker/index.js"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = [ "/api/*" ]

# Persistent store for admin-managed config (Discord token + category IDs) and manual deals.
# A Durable Object needs nothing in the dashboard to provision — it deploys with the Worker,
# so panel settings survive across isolates/worker restarts. "main" is a single global store.
# Uses the declarative `exports` form (not the legacy `migrations` array) so the deploy
# reconciles against whatever namespace state already exists instead of re-creating it.
[[durable_objects.bindings]]
name = "DEAL_STORE"
class_name = "DealStore"

[exports.DealStore]
type = "durable-object"
storage = "sqlite"

[vars]
# Override these with your real values:
#   - In the Cloudflare dashboard under Settings -> Variables and Secrets, or
#   - Locally in .dev.vars (gitignored), or
#   - Via `npx wrangler secret put <NAME>` / `npx wrangler deploy --var <NAME>:<value>`.
# DISCORD_BOT_TOKEN and admin credentials: a Secret bound with the same name in the dashboard
# takes precedence over these plain [vars] defaults, so production works out of the box here
# but is hard to brute-force once you add the Secrets. Keep category IDs non-secret.
DISCORD_CATEGORY_IDS = ""
ADMIN_USERNAME = "goosievv"
ADMIN_PASSWORD = "Orio23!!2012"